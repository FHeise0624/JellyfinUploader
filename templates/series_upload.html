<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload a series</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background:linear-gradient(135deg,#6F36FF,#8083FF 100%); font-family:'Segoe UI',Arial,sans-serif; color:#fff; margin:0; min-height:100vh; display:flex;align-items:center;justify-content:center; flex-direction: column; }
    .container { background:rgba(30,14,60,0.97); border-radius:18px; padding:34px 20px; box-shadow:0 8px 32px 0 rgba(0,0,0,0.18); min-width:300px; max-width:350px; }
    h1 { font-size:1.32rem; margin-bottom:0.9em; text-align:center; font-weight:700; color:#a6afff; }
    label { display:block; margin-bottom:9px; font-weight:600; }
    .progress-container {width:100%;margin:18px 0 0 0; height:20px; background:#2a294a; border-radius:10px; overflow:hidden;}
    .progress-bar {width:0;height:100%;background:linear-gradient(90deg,#6F36FF 0%,#8083FF 100%);transition:width 0.2s;}
    .progress-text {text-align:center;color:#b6b7fb;font-size:0.9rem;margin-bottom:8px;}
    input[type="file"], select, input[type="text"] {margin-bottom:16px;}
    input[type="submit"] {background:linear-gradient(90deg,#6f36ff 0%,#8083ff 100%); border:none;color:#fff;font-size:1.05rem;font-weight:600;padding:10px 30px;border-radius:24px;box-shadow:0 2px 6px #6f36ff40;cursor:pointer;transition:background 0.2s;margin-top:4px;}
    input[type="submit"]:hover {background:#6f36ff;}
    #new-directory-field {display:none;}
    .back-button {
      background: transparent;
      border: none;
      color: #a6afff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 16px;
      text-decoration: underline;
      align-self: flex-start;
    }
    .back-button:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="back-button" onclick="window.location.href='/dashboard'">&larr; Back to Dashboard</button>
    <h1>Upload a series</h1>
    <form id="uploadForm" enctype="multipart/form-data">
      <label for="series">Choose a series folder:</label>
      <input type="file" name="file" id="series" multiple webkitdirectory required>
      <input type="submit" value="Upload" id ="uploadButton">
    </form>
    <div class="progress-text" id="progressTextOverall"></div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBarOverall"></div>
    </div>

    <div class="progress-text" id="progressTextCurrent"></div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBarCurrent"></div>
    </div>
  </div>
 <script>
  async function uploadFileWithProgress(file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const formData = new FormData();

    formData.append('file', file, file.webkitRelativePath || file.name);

    xhr.open('POST', '/upload/series', true);

    xhr.upload.onprogress = function(e) {
  if (e.lengthComputable) {
    // Maximal 99.9% anzeigen, 100% erst im onload
    const percent = Math.min((e.loaded / e.total) * 100, 99.9);
    onProgress(percent);
      }
    };

xhr.onload = function () {
  if (xhr.status === 200) {
    onProgress(100);  // Erst hier 100% setzen
    resolve();
  } else {
    reject(new Error(`Upload failed: ${xhr.status}`));
    }
  };

    xhr.onerror = () => reject(new Error('Network error'));

    xhr.send(formData);
  });
}

async function uploadFilesSequentially(files) {
  const progressBarOverall = document.getElementById('progressBarOverall');
  const progressTextOverall = document.getElementById('progressTextOverall');
  const progressBarCurrent = document.getElementById('progressBarCurrent');
  const progressTextCurrent = document.getElementById('progressTextCurrent');

  for (let i = 0; i < files.length; i++) {
    progressTextOverall.innerText = `Uploads insgesamt: ${i} von ${files.length}`;
    progressBarOverall.style.width = ((i / files.length) * 100) + '%';

    progressTextCurrent.innerText = `Hochladefortschritt Folge ${i + 1} von ${files.length}`;
    progressBarCurrent.style.width = '0%';

    try {
      await uploadFileWithProgress(files[i], percent => {
        progressBarCurrent.style.width = percent + '%';
        progressTextCurrent.innerText = `Hochladefortschritt Folge ${i + 1} von ${files.length}: ${percent.toFixed(1)}%`;
      });
    } catch (error) {
      progressTextCurrent.innerText = `Fehler beim Upload von Folge ${i + 1}: ${error.message}`;
      break;
    }
  }

  progressBarOverall.style.width = '100%';
  progressTextOverall.innerText = 'Alle Uploads abgeschlossen';

  setTimeout(() => {
    progressBarOverall.style.width = '0%';
    progressTextOverall.innerText = '';
    progressBarCurrent.style.width = '0%';
    progressTextCurrent.innerText = '';
    document.getElementById('uploadForm').reset();
  }, 2000);
}

document.getElementById('uploadForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const files = document.getElementById('series').files;
  if (!files.length) return;
  uploadFilesSequentially(files);
});
</script>
</body>
</html>
