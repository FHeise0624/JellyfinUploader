{% extends "base.html" %}
{% block title %}Sign in – Jellyfin Uploader{% endblock %}
{% block body %}
<div class="card" style="margin-top:80px;">
  <svg class="logo" viewBox="0 0 464 464" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="232" cy="232" rx="232" ry="232" fill="#6F36FF"/>
    <path d="M232 368c119.6-92.837 207.431-101.628 185.93-212.196C397.536 49.875 318.608 82.371 232 168.001c-86.608-85.63-165.536-118.126-185.93-12.197C24.569 266.372 112.399 275.163 232 368z" fill="#a48fff"/>
  </svg>
  <h1 class="card-title">Welcome back</h1>

  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}

  <form method="post">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username">
    </div>
    <div class="form-group" style="margin-bottom:22px;">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
