{% extends "base.html" %}
{% block title %}Upload Photos – Jellyfin Uploader{% endblock %}
{% block body %}
<div class="card" style="margin-top:40px;">
  <a class="back-link" href="/dashboard">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Dashboard
  </a>

  <h1 class="card-title">Upload Photos</h1>

  <form id="uploadForm">
    <label class="toggle-row">
      <span class="toggle">
        <input type="checkbox" name="shared" id="shared">
        <span class="toggle-track"></span>
      </span>
      <span>Upload to shared folder</span>
    </label>

    <div class="form-group">
      <label class="form-label" for="directory">Destination folder</label>
      <select id="directory" name="directory" required>
        <optgroup label="Personal" class="personal-group">
          {% for d in personal_dirs %}
            <option value="{{ d }}">{{ d }}</option>
          {% endfor %}
        </optgroup>
        <optgroup label="Shared" class="shared-group" style="display:none;">
          {% for d in shared_dirs %}
            <option value="{{ d }}">{{ d }}</option>
          {% endfor %}
        </optgroup>
        <option value="__new__">Create new folder…</option>
      </select>
    </div>

    <div class="form-group" id="new-directory-field" style="display:none;">
      <label class="form-label" for="new_directory">New folder name</label>
      <input type="text" name="new_directory" id="new_directory" placeholder="e.g. Summer 2025">
    </div>

    <div class="file-zone">
      <input type="file" name="picture" id="picture" multiple accept=".jpg,.jpeg,.png,.gif,.webp,.bmp,.tiff" required>
      <span class="file-zone-icon">📷</span>
      <span class="file-zone-hint">Click to choose photos</span>
      <div class="file-zone-name" id="pictureName"></div>
    </div>

    <button class="btn" type="submit">Upload</button>
  </form>

  <div class="progress-wrap">
    <div class="progress-label" id="progressText"></div>
    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  document.getElementById('picture').addEventListener('change', function() {
    var n = this.files.length;
    document.getElementById('pictureName').textContent = n === 1 ? this.files[0].name : n + ' files selected';
  });

  document.getElementById('directory').addEventListener('change', function() {
    var show = this.value === '__new__';
    document.getElementById('new-directory-field').style.display = show ? 'block' : 'none';
    document.getElementById('new_directory').required = show;
  });

  document.getElementById('shared').addEventListener('change', function() {
    var personalGroup = document.querySelector('optgroup.personal-group');
    var sharedGroup = document.querySelector('optgroup.shared-group');
    if (this.checked) {
      personalGroup.style.display = 'none';
      sharedGroup.style.display = 'block';
    } else {
      personalGroup.style.display = 'block';
      sharedGroup.style.display = 'none';
    }
    document.getElementById('directory').selectedIndex = 0;
    document.getElementById('new-directory-field').style.display = 'none';
    document.getElementById('new_directory').required = false;
  });

  document.getElementById('uploadForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var files = document.getElementById('picture').files;
    var directory = document.getElementById('directory').value;
    var new_directory = document.getElementById('new_directory').value;
    var shared = document.getElementById('shared').checked;
    if (!files.length) return;

    var formData = new FormData();
    for (var i = 0; i < files.length; i++) formData.append('picture', files[i], files[i].name);
    formData.append('directory', directory);
    if (directory === '__new__' && new_directory) formData.append('new_directory', new_directory);
    if (shared) formData.append('shared', 'on');

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload/photos', true);
    var progressBar = document.getElementById('progressBar');
    var progressText = document.getElementById('progressText');

    xhr.upload.onprogress = function(e) {
      if (e.lengthComputable) {
        var pct = (e.loaded / e.total * 100).toFixed(1);
        progressBar.style.width = pct + '%';
        progressText.textContent = 'Uploading… ' + pct + '%';
      }
    };

    xhr.onload = function() {
      if (xhr.status === 200) {
        progressBar.style.width = '100%';
        progressText.textContent = 'Upload complete!';
        setTimeout(() => {
          progressBar.style.width = '0';
          progressText.textContent = '';
          document.getElementById('uploadForm').reset();
          document.getElementById('pictureName').textContent = '';
          document.getElementById('new-directory-field').style.display = 'none';
          document.querySelector('optgroup.personal-group').style.display = 'block';
          document.querySelector('optgroup.shared-group').style.display = 'none';
        }, 2000);
      } else {
        progressText.textContent = 'Error: ' + xhr.status;
      }
    };

    xhr.send(formData);
  });
</script>
{% endblock %}
