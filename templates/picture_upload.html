<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload a Picture</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background:linear-gradient(135deg,#6F36FF,#8083FF 100%); font-family:'Segoe UI',Arial,sans-serif; color:#fff; margin:0; min-height:100vh; display:flex;align-items:center;justify-content:center; flex-direction: column; }
    .container { background:rgba(30,14,60,0.97); border-radius:18px; padding:34px 20px; box-shadow:0 8px 32px 0 rgba(0,0,0,0.18); min-width:300px; max-width:350px; }
    h1 { font-size:1.32rem; margin-bottom:0.9em; text-align:center; font-weight:700; color:#a6afff; }
    label { display:block; margin-bottom:9px; font-weight:600; }
    .progress-container {width:100%;margin:18px 0 0 0; height:20px; background:#2a294a; border-radius:10px; overflow:hidden;}
    .progress-bar {width:0;height:100%;background:linear-gradient(90deg,#6F36FF 0%,#8083FF 100%);transition:width 0.2s;}
    .progress-text {text-align:center;color:#b6b7fb;font-size:0.9rem;margin-bottom:8px;}
    input[type="file"], select, input[type="text"] {margin-bottom:16px;}
    input[type="submit"] {background:linear-gradient(90deg,#6f36ff 0%,#8083ff 100%); border:none;color:#fff;font-size:1.05rem;font-weight:600;padding:10px 30px;border-radius:24px;box-shadow:0 2px 6px #6f36ff40;cursor:pointer;transition:background 0.2s;margin-top:4px;}
    input[type="submit"]:hover {background:#6f36ff;}
    #new-directory-field {display:none;}
    .back-button {
      background: transparent;
      border: none;
      color: #a6afff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      margin-bottom: 16px;
      text-decoration: underline;
      align-self: flex-start;
    }
    .back-button:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="back-button" onclick="window.location.href='/dashboard'">&larr; Back to Dashboard</button>
    <h1>Upload a Picture</h1>
    <form id="uploadForm">
      <label for="directory">Choose destination folder:</label>
      <select id="directory" name="directory" required>
          <optgroup label="Personal Directories" class="personal-group">
            {% for d in personal_dirs %}
              <option value="{{ d }}">{{ d }}</option>
            {% endfor %}
          </optgroup>
          <optgroup label="Shared Directories" class="shared-group" style="display:none;">
            {% for d in shared_dirs %}
              <option value="{{ d }}">{{ d }}</option>
            {% endfor %}
          </optgroup>
          <option value="__new__">Create a new folder...</option>
      </select>
      <div id="new-directory-field">
        <label for="new_directory">New folder name:</label>
        <input type="text" name="new_directory" id="new_directory">
      </div>
      <label>
          <input type="checkbox" name="shared" id="shared">
          Upload to shared folder
      </label>
      <label for="picture">Choose a picture:</label>
      <input type="file" name="picture" id="picture" multiple accept=".jpg,.jpeg,.png,.gif,.bmp" required>
      <input type="submit" value="Upload">
    </form>
    <div class="progress-text" id="progressText"></div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>
  <script>
  document.getElementById('directory').addEventListener('change', function() {
    var newField = document.getElementById('new-directory-field');
    var newInput = document.getElementById('new_directory');
    if (this.value === "__new__") {
      newField.style.display = "block";
      newInput.required = true;
    } else {
      newField.style.display = "none";
      newInput.required = false;
    }
  });

  document.getElementById('shared').addEventListener('change', function() {
    var personalGroup = document.querySelector('optgroup.personal-group');
    var sharedGroup = document.querySelector('optgroup.shared-group');
    if (this.checked) {
      personalGroup.style.display = 'none';
      sharedGroup.style.display = 'block';
    } else {
      personalGroup.style.display = 'block';
      sharedGroup.style.display = 'none';
    }
    var directorySelect = document.getElementById('directory');
    var event = new Event('change');
    directorySelect.dispatchEvent(event);
  });

  window.addEventListener('DOMContentLoaded', function() {
    var sharedCheckbox = document.getElementById('shared');
    if (sharedCheckbox) {
      var event = new Event('change');
      sharedCheckbox.dispatchEvent(event);
    }
  });

  document.getElementById('uploadForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var form = e.target;
    var files = document.getElementById('picture').files;
    var directory = document.getElementById('directory').value;
    var new_directory = document.getElementById('new_directory').value;
    var shared = document.getElementById('shared').checked;
    if (files.length === 0) return;
    var formData = new FormData();
    for (var i = 0; i < files.length; i++) {
      formData.append('picture', files[i], files[i].name);
    }
    formData.append('directory', directory);
    if (directory === "__new__" && new_directory) {
      formData.append('new_directory', new_directory);
    }
    if (shared) {
      formData.append('shared', 'on');
    }
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload/photos', true);
    var progressBar = document.getElementById('progressBar');
    var progressText = document.getElementById('progressText');
    xhr.upload.onprogress = function(e) {
      if (e.lengthComputable) {
        var percent = (e.loaded / e.total * 100).toFixed(1);
        progressBar.style.width = percent + "%";
        progressText.innerText = "Uploading... " + percent + "%";
      }
    };
    xhr.onload = function () {
      if (xhr.status === 200) {
        progressBar.style.width = "100%";
        progressText.innerText = "Upload complete!";
        setTimeout(() => {
          progressBar.style.width = "0";
          progressText.innerText = "";
          form.reset();
          document.getElementById('new-directory-field').style.display = "none";
          document.getElementById('shared').checked = false;
          var event = new Event('change');
          document.getElementById('shared').dispatchEvent(event);
        }, 2000);
      } else {
        progressText.innerText = "Error: " + xhr.status;
      }
    };
    xhr.send(formData);
  });
  </script>
</body>
</html>
