{% extends "base.html" %}
{% block title %}Add User – Jellyfin Uploader{% endblock %}
{% block body %}
<div class="card" style="margin-top:40px;">
  <a class="back-link" href="{{ url_for('admin_users') }}">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    User list
  </a>

  <h1 class="card-title">Add User</h1>

  <form action="{{ url_for('admin_new_user') }}" method="post">
    <div class="form-group">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="off">
    </div>
    <div class="form-group" style="margin-bottom:16px;">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password">
    </div>

    <label class="toggle-row" style="margin-bottom:22px;">
      <span class="toggle">
        <input type="checkbox" name="is_admin" value="1">
        <span class="toggle-track"></span>
      </span>
      <span>Administrator rights</span>
    </label>

    <button class="btn" type="submit">Create user</button>
  </form>
</div>
{% endblock %}
