{% extends "base.html" %}
{% block title %}Upload Videos – Jellyfin Uploader{% endblock %}
{% block body %}
<div class="card" style="margin-top:40px;">
  <a class="back-link" href="/dashboard">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Dashboard
  </a>

  <h1 class="card-title">Upload Videos</h1>

  <form id="uploadForm">
    <label class="toggle-row">
      <span class="toggle">
        <input type="checkbox" id="sharedCheckbox" name="shared">
        <span class="toggle-track"></span>
      </span>
      <span>Upload to shared folder</span>
    </label>

    <div class="form-group">
      <label class="form-label" for="directory">Destination folder</label>
      <select id="directory" name="directory" required>
        <optgroup id="personalGroup" label="Personal">
          {% for d in personal_dirs %}
            <option value="{{ d }}">{{ d }}</option>
          {% endfor %}
        </optgroup>
        <optgroup id="sharedGroup" label="Shared" style="display:none;">
          {% for d in shared_dirs %}
            <option value="{{ d }}">{{ d }}</option>
          {% endfor %}
        </optgroup>
        <option value="__new__">Create new folder…</option>
      </select>
    </div>

    <div class="form-group" id="new-directory-field" style="display:none;">
      <label class="form-label" for="new_directory">New folder name</label>
      <input type="text" name="new_directory" id="new_directory" placeholder="e.g. Road Trip 2025">
    </div>

    <div class="file-zone">
      <input type="file" name="video" id="video" multiple accept=".mp4,.mov,.mkv,.avi,.flv,.wmv,.webm,.3gp,.m4v" required>
      <span class="file-zone-icon">🎬</span>
      <span class="file-zone-hint">Click to choose video files</span>
      <div class="file-zone-name" id="videoName"></div>
    </div>

    <button class="btn" type="submit">Upload</button>
  </form>

  <div class="progress-wrap">
    <div class="progress-label" id="progressText"></div>
    <div class="progress-track">
      <div class="progress-fill" id="progressBar"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  const dirSelect = document.getElementById('directory');
  const newField  = document.getElementById('new-directory-field');
  const newInput  = document.getElementById('new_directory');
  const checkbox  = document.getElementById('sharedCheckbox');
  const personal  = document.getElementById('personalGroup');
  const shared    = document.getElementById('sharedGroup');

  document.getElementById('video').addEventListener('change', function() {
    var n = this.files.length;
    document.getElementById('videoName').textContent = n === 1 ? this.files[0].name : n + ' files selected';
  });

  dirSelect.addEventListener('change', function() {
    var show = this.value === '__new__';
    newField.style.display = show ? 'block' : 'none';
    newInput.required = show;
    if (!show) newInput.value = '';
  });

  checkbox.addEventListener('change', function() {
    if (this.checked) { personal.style.display = 'none'; shared.style.display = 'block'; }
    else              { personal.style.display = 'block'; shared.style.display = 'none'; }
    dirSelect.selectedIndex = 0;
    newField.style.display = 'none';
    newInput.required = false;
  });

  document.getElementById('uploadForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var files = document.getElementById('video').files;
    var directory = dirSelect.value;
    var newDirectory = newInput.value;
    if (!files.length) return;

    var formData = new FormData();
    for (var i = 0; i < files.length; i++) formData.append('video', files[i], files[i].name);
    formData.append('directory', directory);
    if (directory === '__new__' && newDirectory) formData.append('new_directory', newDirectory);
    if (checkbox.checked) formData.append('shared', 'on');

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload/video', true);
    var progressBar = document.getElementById('progressBar');
    var progressText = document.getElementById('progressText');

    xhr.upload.onprogress = function(e) {
      if (e.lengthComputable) {
        var pct = (e.loaded / e.total * 100).toFixed(1);
        progressBar.style.width = pct + '%';
        progressText.textContent = 'Uploading… ' + pct + '%';
      }
    };

    xhr.onload = function() {
      if (xhr.status === 200) {
        progressBar.style.width = '100%';
        progressText.textContent = 'Upload complete!';
        setTimeout(function() {
          progressBar.style.width = '0';
          progressText.textContent = '';
          document.getElementById('uploadForm').reset();
          document.getElementById('videoName').textContent = '';
          newField.style.display = 'none';
          shared.style.display = 'none';
          personal.style.display = 'block';
          checkbox.checked = false;
        }, 2000);
      } else {
        progressText.textContent = 'Error: ' + xhr.status;
      }
    };

    xhr.send(formData);
  });
</script>
{% endblock %}
